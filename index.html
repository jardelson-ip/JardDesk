<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jard Desk</title>
<style>
:root{--bg:#030814;--gl:rgba(18,42,98,.38);--bd:rgba(120,170,255,.16);--pri:#3b8bff;--cy:#25d9ff;--vi:#7c6bff;--tx:#e8f0ff;--mut:#8fa8d6;--ok:#2ee59d;--ac:#ffb020}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;gap:18px;padding:18px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body:before{background:#1a5fff;top:-160px;left:-120px}body:after{background:#0bb8e8;bottom:-200px;right:-120px;animation-delay:-7s;opacity:.3}
@keyframes fl{to{transform:translate(90px,70px) scale(1.15)}}
.glass,aside,.card,.box{background:var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px}
aside{width:230px;padding:22px 14px;flex-shrink:0;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}
.logo{font-weight:800;font-size:20px;letter-spacing:2px;margin:4px 10px 26px;background:linear-gradient(90deg,var(--cy),var(--pri));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-weight:300}
button{font:inherit;position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s,background .25s}
button:active{transform:scale(.95)}
nav button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:13px 16px;border-radius:14px;font-size:15px;cursor:pointer;margin-bottom:6px}
nav button:hover{background:rgba(59,139,255,.14);color:var(--tx);transform:translateX(4px)}
nav button.on{background:linear-gradient(120deg,var(--pri),var(--vi));color:#fff;box-shadow:0 8px 24px -6px #3b8bffaa}
.bk{margin-top:auto;font-size:12px;color:var(--mut)}
main{flex:1;min-width:0;padding:6px 4px}
h2{margin:4px 0 20px;font-size:28px;font-weight:700;letter-spacing:.3px}
section{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:end;padding:16px;border-radius:20px}
label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px}
input,select,textarea{background:rgba(3,10,30,.55);border:1px solid var(--bd);color:var(--tx);padding:11px 14px;border-radius:12px;font:inherit;outline:none;transition:.2s;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(37,217,255,.18),0 0 18px rgba(37,217,255,.25)}
.btn{background:linear-gradient(120deg,var(--pri),var(--vi));border:0;color:#fff;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:600;box-shadow:0 8px 22px -8px #3b8bff}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px #3b8bffcc}
.btn.g{background:rgba(59,139,255,.12);border:1px solid var(--bd);box-shadow:none;font-weight:400}
.btn.g:hover{background:rgba(59,139,255,.25)}
.wrap{overflow:auto}
table{border-collapse:separate;border-spacing:0 9px;width:100%;font-size:14px}
th{color:var(--cy);text-align:left;padding:4px 14px;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;white-space:nowrap}
tbody tr{animation:in .5s both;animation-delay:calc(var(--i)*45ms);transition:.25s}
td{padding:14px;background:var(--gl);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);transition:.25s}
td:first-child{border-left:1px solid var(--bd);border-radius:16px 0 0 16px;font-weight:600}
td:last-child{border-right:1px solid var(--bd);border-radius:0 16px 16px 0}
tbody tr:hover{transform:translateY(-2px) scale(1.005)}tbody tr:hover td{background:rgba(59,139,255,.2);border-color:rgba(37,217,255,.4)}
.tag{padding:5px 13px;border-radius:30px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.t-ok{background:rgba(46,229,157,.13);color:var(--ok)}
.t-no{background:rgba(255,176,32,.13);color:var(--ac)}.t-no:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px transparent;box-shadow:0 0 0 5px rgba(255,176,32,.0);opacity:.4}}
.ic{background:none;border:0;cursor:pointer;font-size:16px;padding:6px 8px;border-radius:10px}.ic:hover{background:rgba(59,139,255,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{padding:20px;animation:in .5s both;transition:.3s}.card:hover{transform:translateY(-4px);border-color:rgba(37,217,255,.4);box-shadow:0 18px 40px -18px #3b8bff}
.card h3{margin:0 0 14px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi{font-size:44px;font-weight:800;background:linear-gradient(120deg,var(--cy),var(--pri));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.row .n{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{flex:1;height:10px;background:rgba(3,10,30,.6);border-radius:8px;overflow:hidden}
.row .b i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pri),var(--cy));transform-origin:left;animation:gw .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes gw{from{transform:scaleX(0)}}
.donut{width:140px;height:140px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;box-shadow:0 0 30px rgba(46,229,157,.2);animation:sp 1s ease both}
@keyframes sp{from{transform:rotate(-120deg) scale(.6);opacity:0}}
.donut div{width:96px;height:96px;background:#0a1a3d;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px}
.docs{display:grid;grid-template-columns:310px 1fr;gap:16px}
.dl{max-height:66vh;overflow:auto}
.di{padding:13px 14px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:6px;position:relative;overflow:hidden;transition:.2s}
.di:hover{background:rgba(59,139,255,.16);transform:translateX(4px)}.di.on{background:linear-gradient(120deg,rgba(59,139,255,.35),rgba(124,107,255,.3));border-color:var(--cy)}
.view{white-space:pre-wrap;line-height:1.7;min-height:200px;margin-bottom:14px}
.mod{position:fixed;inset:0;background:rgba(2,6,18,.7);backdrop-filter:blur(6px);display:none;place-items:center;z-index:9}.mod.show{display:grid;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.box{background:rgba(10,26,64,.92);padding:26px;width:min(540px,94vw);box-shadow:0 30px 80px -20px #3b8bff,0 0 0 1px rgba(37,217,255,.25);animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(20px)}}
.box h3{margin:0 0 18px;font-size:20px}.box .f{margin-bottom:14px}.box input,.box textarea,.box select{width:100%}
.hint{font-size:11px;color:var(--mut);margin:0 0 14px}kbd{background:rgba(59,139,255,.2);padding:1px 7px;border-radius:6px;border:1px solid var(--bd)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
#toast{position:fixed;bottom:26px;right:26px;background:linear-gradient(120deg,var(--pri),var(--vi));padding:14px 22px;border-radius:14px;box-shadow:0 14px 34px -8px #3b8bff;transform:translateY(90px);opacity:0;transition:.4s cubic-bezier(.2,1.2,.3,1);z-index:20}#toast.s{transform:none;opacity:1}
.hide{display:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(59,139,255,.4);border-radius:8px}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static}.docs{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--gl);border:1px solid var(--bd);color:var(--mut);padding:11px 18px;border-radius:30px;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.5px}
.tab:hover{color:var(--tx);transform:translateY(-2px)}
.tab.on{background:linear-gradient(120deg,var(--pri),var(--vi));color:#fff;box-shadow:0 8px 22px -8px #3b8bff}
.tab.nw{border-style:dashed;color:var(--cy)}
.tab .x{margin-left:8px;opacity:.6}.tab .x:hover{opacity:1;color:#ff6b6b}
.pi{max-width:100%;max-height:320px;border-radius:12px;margin:8px 0;display:block;cursor:zoom-in;border:1px solid var(--bd)}.pi.zm{max-height:none;cursor:zoom-out}
.gal{margin-top:10px}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.tt{position:relative;text-align:center;font-size:10px;color:var(--mut)}.tt img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.tt .x{position:absolute;top:-6px;right:-6px;background:#ff6b6b;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;cursor:pointer;font-size:12px}
.agd{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{text-align:center;font-size:11px;color:var(--mut);padding:4px}
.cd{aspect-ratio:1;border-radius:12px;background:rgba(3,10,30,.45);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;transition:.2s}
.cd:hover{border-color:var(--cy);transform:scale(1.08)}.cd.td{color:var(--cy);font-weight:800}.cd.sl{background:linear-gradient(120deg,var(--pri),var(--vi));color:#fff}
.cd i{width:6px;height:6px;border-radius:50%;background:var(--ac);position:absolute;bottom:6px}.cd.e{visibility:hidden}
.ev{padding:12px 14px;border-radius:14px;background:rgba(3,10,30,.45);border:1px solid var(--bd);margin-bottom:8px}
@media(max-width:900px){.agd{grid-template-columns:1fr}}
.card.w{grid-column:1/-1}
.bc{transform-origin:bottom;transform-box:fill-box;animation:gh .7s both}@keyframes gh{from{transform:scaleY(0)}}
.big .tt img{width:120px;height:84px;cursor:zoom-in}
.lbx{position:fixed;inset:0;background:rgba(2,6,18,.88);display:grid;place-items:center;z-index:30;cursor:zoom-out}.lbx img{max-width:94vw;max-height:92vh;border-radius:12px}
.kb{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;min-height:60vh}
.ls{width:290px;flex-shrink:0;padding:14px;border-radius:20px;background:var(--gl);border:1px solid var(--bd);max-height:72vh;display:flex;flex-direction:column;transition:.2s}
.ls.ov{border-color:var(--cy);box-shadow:0 0 22px rgba(37,217,255,.3)}
.lh{display:flex;align-items:center;gap:6px;margin-bottom:10px}.lh b{flex:1;cursor:text;padding:4px 6px;border-radius:8px}.lh b:hover{background:rgba(59,139,255,.16)}
.cs{overflow:auto;min-height:24px;display:flex;flex-direction:column;gap:8px}
.kc{background:rgba(10,26,64,.85);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;cursor:grab;transition:.2s;font-size:14px}
.kc:hover{border-color:var(--cy);transform:translateY(-2px)}.kc.dg{opacity:.35}
.lb{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#04122e;margin:0 5px 6px 0}
.lb.tg{cursor:pointer;opacity:.4}.lb.tg.on{opacity:1;outline:2px solid #fff}
.add{background:none;border:1px dashed var(--bd);color:var(--mut);padding:10px;border-radius:12px;cursor:pointer;width:100%;margin-top:8px}.add:hover{color:var(--cy);border-color:var(--cy)}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;margin:0 6px 6px 0}.sw.on{border-color:#fff}
</style></head><body>
<aside><div class="logo">JARD <span>DESK</span></div>
<nav><button data-p="at" class="on">📞 Atendimentos</button><button data-p="db">📊 Dashboards</button><button data-p="dc">📁 Documentos</button><button data-p="qt">🗂 Quadro de Tarefas</button></nav>
<div class="bk">Backup dos dados<br><br><button class="btn g" onclick="exp()" style="width:100%;margin-bottom:8px">⬇ Exportar</button>
<button class="btn g" onclick="$('#imp').click()" style="width:100%">⬆ Importar</button>
<input id="imp" type="file" accept=".json" class="hide" onchange="imp(event)"></div></aside>
<main>
<section id="at"><h2>Atendimentos</h2>
<div class="bar glass">
<div><label>Resolvido</label><select id="fr"><option value="">Todos</option><option value="ok">OK</option><option value="no">A acompanhar</option></select></div>
<div><label>Data</label><input type="date" id="fd"></div>
<div><label>Reclamante (cidade)</label><input id="fc" placeholder="Buscar..."></div>
<div><label>Nome</label><input id="fn" placeholder="Buscar..."></div>
<button class="btn g" onclick="clr()">Limpar</button>
<button class="btn" onclick="openC()" style="margin-left:auto">＋ Novo atendimento</button></div>
<div class="wrap"><table><thead><tr><th>Nome</th><th>Reclamante / Cidade</th><th>Problema</th><th>Status</th><th>Número</th><th>Data</th><th>Prazo de espera</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section>

<section id="db" class="hide"><h2>Dashboards</h2><div class="grid" id="dg"></div></section>

<section id="dc" class="hide"><h2>Documentos</h2>
<div class="tabs" id="tabs"></div>
<div class="bar glass"><div id="dsw" style="flex:1;max-width:440px"><label>Pesquisar</label><input id="ds" style="width:100%" oninput="rd()"></div>
<button class="btn" id="nb" onclick="openD()" style="margin-left:auto"></button></div>
<div id="dv"></div></section>
<section id="qt" class="hide"><h2>Quadro de Tarefas</h2><div class="tabs" id="qtabs"></div><div id="qv"></div></section>
</main>

<div class="mod" id="mc"><div class="box"><h3>📞 Atendimento</h3><p class="hint">Use <kbd>Enter</kbd> para ir ao próximo campo; no último, salva.</p>
<div class="f"><label>Nome</label><input id="cn" autocomplete="off"></div>
<div class="f"><label>Cidade / Reclamante</label><input id="cc" list="cl" autocomplete="off"><datalist id="cl"></datalist></div>
<div class="f"><label>Problema</label><input id="cp" autocomplete="off"></div>
<div class="f"><label>Número</label><input id="cu" autocomplete="off"></div>
<div class="f"><label>Data</label><input type="date" id="cd"></div>
<div class="f"><label>Status</label><select id="co"><option value="no">A acompanhar</option><option value="ok">OK</option></select></div>
<div style="text-align:right"><button class="btn g" onclick="closeM()">Cancelar</button> <button class="btn" onclick="saveC()">Salvar</button></div></div></div>

<div class="mod" id="md"><div class="box" id="mb"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const K='jd_calls',KD='jd_docs';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let calls=ld(K,[{id:1,nome:'Vivian',cidade:'Monte Aprazivel',problema:'Calculo Vigilancia atrasado',ok:true,numero:'17 98125-4655',data:'2026-09-28'},{id:2,nome:'Aline',cidade:'Piracaia',problema:'Ajuda com email de CDA',ok:true,numero:'RODRIGO PASSOU',data:'2026-09-28'}]);
let docs=ld(KD,[]);let cur=null,editC=null,editD=null;let boards=ld('jd_boards',[]),cb=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(calls));localStorage.setItem(KD,JSON.stringify(docs));localStorage.setItem('jd_types',JSON.stringify(types));localStorage.setItem('jd_boards',JSON.stringify(boards))}catch(e){toast('⚠ Armazenamento cheio! Exporte um backup e use imagens menores')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=d=>d.split('-').reverse().join('/');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const days=d=>Math.max(0,Math.round((today()-new Date(d+'T00:00:00'))/864e5));
const prazo=c=>{if(c.ok)return'Concluído';const n=days(c.data);return n===0?'Hoje (0 dias)':n+(n===1?' dia':' dias')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('s'),2200)}
document.addEventListener('click',e=>{const b=e.target.closest('button,.di');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,p=document.createElement('span');p.className='rip';p.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(p);setTimeout(()=>p.remove(),600)});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['at','db','dc','qt'].forEach(i=>$('#'+i).classList.toggle('hide',i!==b.dataset.p));if(b.dataset.p==='db')dash();if(b.dataset.p==='dc')rd();if(b.dataset.p==='qt')qr()});
function rt(){const r=$('#fr').value,d=$('#fd').value,c=$('#fc').value.toLowerCase(),n=$('#fn').value.toLowerCase();
const l=calls.filter(x=>(!r||(r==='ok')===x.ok)&&(!d||x.data===d)&&x.cidade.toLowerCase().includes(c)&&x.nome.toLowerCase().includes(n)).sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
$('#tb').innerHTML=l.map((x,i)=>`<tr style="--i:${i}"><td>${esc(x.nome)}</td><td>${esc(x.cidade)}</td><td>${esc(x.problema)}${x.obs?`<div class="hint" style="margin:4px 0 0">📝 ${esc(x.obs.slice(0,70))}${x.obs.length>70?'…':''}</div>`:''}</td><td><span class="tag ${x.ok?'t-ok':'t-no'}">${x.ok?'✓ OK':'A acompanhar'}</span></td><td>${esc(x.numero)}</td><td>${br(x.data)}</td><td>${prazo(x)}</td><td style="white-space:nowrap"><button class="ic" title="Observações e prints" onclick="openO(${x.id})">📝${(x.obs||(x.imgs&&x.imgs.length))?'<sup style="color:var(--cy)">●</sup>':''}</button><button class="ic" onclick="openC(${x.id})">✏️</button><button class="ic" onclick="delC(${x.id})">🗑</button></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--mut);padding:30px">Nenhum atendimento</td></tr>'}
['fr','fd','fc','fn'].forEach(i=>$('#'+i).oninput=rt);
const clr=()=>{['fr','fd','fc','fn'].forEach(i=>$('#'+i).value='');rt()};
function openC(id){editC=id||null;const x=calls.find(c=>c.id===id)||{nome:'',cidade:'',problema:'',numero:'',ok:false,data:new Date().toLocaleDateString('sv')};
$('#cl').innerHTML=[...new Set(calls.map(c=>c.cidade))].map(c=>`<option value="${esc(c)}">`).join('');
$('#cn').value=x.nome;$('#cc').value=x.cidade;$('#cp').value=x.problema;$('#cu').value=x.numero;$('#cd').value=x.data;$('#co').value=x.ok?'ok':'no';$('#mc').classList.add('show');setTimeout(()=>$('#cn').focus(),50)}
function saveC(){const o={nome:$('#cn').value.trim(),cidade:$('#cc').value.trim(),problema:$('#cp').value.trim(),numero:$('#cu').value.trim(),data:$('#cd').value,ok:$('#co').value==='ok'};
if(!o.nome||!o.data){toast('Informe ao menos Nome e Data');return}
if(editC)Object.assign(calls.find(c=>c.id===editC),o);else calls.push({id:Date.now(),...o});save();closeM();rt();toast('✓ Atendimento salvo')}
function delC(id){if(confirm('Excluir este atendimento?')){calls=calls.filter(c=>c.id!==id);save();rt();toast('Atendimento excluído')}}
const closeM=()=>document.querySelectorAll('.mod').forEach(m=>m.classList.remove('show'));
$('#mc').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const f=[...$('#mc').querySelectorAll('input,select')],i=f.indexOf(document.activeElement);i>=0&&i<f.length-1?f[i+1].focus():saveC()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#mc').onclick=$('#md').onclick=e=>{if(e.target.classList.contains('mod'))closeM()};
function bars(m){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,7),mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="row"><span class="n" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:${v/mx*100}%"></i></span><b>${v}</b></div>`).join('')||'<span style="color:var(--mut)">Sem dados</span>'}
function dash(){const t=calls.length,ok=calls.filter(c=>c.ok).length,ab=t-ok,pc=t?ok/t*100:0;

const rdC=()=>{dr.t=$('#kt').value;dr.d=$('#kd').value;dr.due=$('#ku').value};
function cm2(){const b=bd();mS=sCard;
$('#mb').innerHTML=`<h3>🗂 Cartão</h3><div class="f"><label>Título</label><input id="kt" autocomplete="off"></div><div class="f"><label>Descrição</label><textarea id="kd" rows="5"></textarea></div><div class="f"><label>Prazo</label><input type="date" id="ku"></div><div class="f"><label>Tags</label>${b.tags.map(t=>`<span class="lb tg ${dr.tags.includes(t.id)?'on':''}" style="background:${t.c}" onclick="rdC();tgl(${t.id})">${esc(t.n)}</span>`).join('')||'<span class="hint">Nenhuma tag neste quadro — crie abaixo.</span>'}<div style="margin-top:8px;display:flex;gap:8px"><input id="tn" placeholder="Nova tag..." style="flex:1" autocomplete="off" onkeydown="if(event.key==='Enter'){event.stopPropagation();nTag()}"><button class="btn g" onclick="nTag()">＋</button></div><div style="margin-top:8px">${sw('rdC();cm2()')}</div></div><div style="display:flex;justify-content:space-between"><button class="btn g" onclick="dCard()">🗑 Excluir</button><span><button class="btn g" onclick="closeM()">Cancelar</button> <button class="btn" onclick="sCard()">Salvar</button></span></div>`;
$('#kt').value=dr.t||'';$('#kd').value=dr.d||'';$('#ku').value=dr.due||'';$('#md').classList.add('show');if(!$('#md').dataset.o)setTimeout(()=>$('#kt').focus(),50)}
function tgl(id){const i=dr.tags.indexOf(id);i>=0?dr.tags.splice(i,1):dr.tags.push(id);cm2()}
function nTag(){rdC();const n=$('#tn').value.trim();if(!n){cm2();return}const t={id:Date.now(),n,c:tc};bd().tags.push(t);dr.tags.push(t.id);save();cm2()}
function sCard(){rdC();if(!dr.t.trim()){toast('Informe o título');return}Object.assign(dl.cards.find(x=>x.id===dr.id),{t:dr.t.trim(),d:dr.d.trim(),due:dr.due,tags:dr.tags});save();closeM();qr();toast('✓ Cartão salvo')}
function dCard(){if(confirm('Excluir este cartão?')){dl.cards=dl.cards.filter(x=>x.id!==dr.id);save();closeM();qr()}}
function tagMgr(){const b=bd();mS=null;$('#mb').innerHTML=`<h3>🏷 Tags de “${esc(b.n)}”</h3><div class="f">${b.tags.map(t=>`<span class="lb" style="background:${t.c}">${esc(t.n)} <b style="cursor:pointer" onclick="dTag(${t.id})">×</b></span>`).join('')||'<span class="hint">Nenhuma tag ainda.</span>'}</div><div style="display:flex;gap:8px"><input id="tn" placeholder="Nome da nova tag" style="flex:1" autocomplete="off" onkeydown="if(event.key==='Enter'){event.stopPropagation();mTag()}"><button class="btn" onclick="mTag()">＋</button></div><div style="margin:10px 0">${sw('tagMgr()')}</div><div style="text-align:right"><button class="btn g" onclick="closeM()">Fechar</button></div>`;$('#md').classList.add('show')}
function mTag(){const n=$('#tn').value.trim();if(!n)return;bd().tags.push({id:Date.now(),n,c:tc});save();tagMgr();qr()}
function dTag(id){const b=bd();b.tags=b.tags.filter(t=>t.id!==id);b.lists.forEach(l=>l.cards.forEach(c=>c.tags=(c.tags||[]).filter(i=>i!==id)));save();tagMgr();qr()}

rt();rd();
</script></body></html>
